name: Download Telegram Files

on:
    workflow_dispatch:

    schedule:
        - cron: "0 */6 * * *"

permissions:
    contents: write

jobs:
    download:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20

            - name: Install dependencies
              run: npm install

            - name: Run downloader
              env:
                  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
              run: node download.js

            - name: Commit downloaded files
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

                  mkdir -p downloads

                  git add downloads

                  git diff --cached --quiet || git commit -m "Add Telegram downloaded files"

                  git push
