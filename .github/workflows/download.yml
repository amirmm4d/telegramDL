name: Download Telegram File

on:
    workflow_dispatch:

    schedule:
        - cron: "0 */6 * * *"

jobs:
    download:
        runs-on: ubuntu-latest

        permissions:
            contents: write

        steps:
            - name: Checkout repo
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20

            - name: Install dependencies
              run: npm install

            - name: Download file from Telegram
              env:
                  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
                  TELEGRAM_FILE_ID: ${{ secrets.TELEGRAM_FILE_ID }}
              run: node download.js

            - name: Commit downloaded files
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

                  git add downloads/

                  git diff --cached --quiet || git commit -m "Add Telegram downloaded file"

                  git push
